# Front LED pattern for pharos: dim violet, only while the display is off.
# MCE reads /etc/mce/*.ini in alphabetical order; "90-" comes after Jolla's files.
# Fields: priority;screen-on;timeout;on-ms;off-ms;RGB
# - priority 200: above the idle pattern (254), below notifications (about 30)
# - screen-on 0: shown only while the display is off
# - timeout 0: never times out
# - on-ms 0, off-ms 0: steady, no blinking (dim colours only work steady)
# - RGB 11042b: red 17, green 4, blue 43 out of 255
# Same group as Jolla's hybris LED patterns.
[LEDPatternHybris]
# The pattern pharos activates over D-Bus.
PatternPharos=200;0;0;0;0;11042b
